<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Captcha Verification</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #4facfe, #00f2fe);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      color: #333;
    }

    .captcha-container {
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      text-align: center;
      max-width: 400px;
      width: 90%;
    }

    img {
      max-width: 100%;
      height: auto;
      margin-bottom: 20px;
    }

    input[type="text"] {
      padding: 10px;
      width: 80%;
      margin-bottom: 20px;
      font-size: 16px;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      background-color: #00c6ff;
      border: none;
      border-radius: 5px;
      color: white;
    }

    .error {
      color: red;
      font-weight: bold;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <div class="captcha-container" id="captcha-box">
    <h2>Verify You're Human</h2>
    <img id="captcha-img" src="" alt="Captcha" />
    <form id="captcha-form">
      <input type="text" id="captcha-input" placeholder="Enter the number..." required />
      <br />
      <button type="submit">Submit</button>
    </form>
    <div class="error" id="error-msg"></div>
  </div>

  <script>
    const query = new URLSearchParams(window.location.search);
    const encodedTo = query.get("to");

    if (!encodedTo) {
      document.body.innerHTML = "<h2 style='color:white;'>Missing 'to' parameter.</h2>";
      throw new Error("Missing 'to' parameter");
    }

    // Decode the base64 URL
    let decodedUrl;
    try {
      decodedUrl = atob(encodedTo);
    } catch (e) {
      document.body.innerHTML = "<h2 style='color:white;'>Invalid 'to' parameter.</h2>";
      throw new Error("Invalid base64 in 'to' parameter");
    }

    // Remove ?to=... from URL using history API
    window.history.replaceState({}, document.title, window.location.pathname);

    // Load captcha
    let correctAnswer = "";
    fetch("https://wowcaptcha.netlify.app/api/")
      .then(res => res.json())
      .then(data => {
        document.getElementById("captcha-img").src = data.captcha;
        correctAnswer = data.correct;
      })
      .catch(() => {
        document.getElementById("captcha-box").innerHTML = "<p>Failed to load captcha. Try again later.</p>";
      });

    // Handle form submission
    document.getElementById("captcha-form").addEventListener("submit", function(e) {
      e.preventDefault();
      const userAnswer = document.getElementById("captcha-input").value.trim();
      const errorBox = document.getElementById("error-msg");

      if (userAnswer === correctAnswer) {
        // Determine if URL has query parameters already
        const hasParams = decodedUrl.includes("?");
        const separator = hasParams ? "&" : "?";
        window.location.href = `${decodedUrl}${separator}captchasolved=true`;
      } else {
        errorBox.textContent = "Nope!";
      }
    });
  </script>
</body>
</html>
